name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and test
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate semantic version tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag ${tag} is not a supported semantic version tag" >&2
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"

          if [[ "${tag}" != "${expected_tag}" ]]; then
            echo "Tag ${tag} does not match package.json version ${package_version}" >&2
            exit 1
          fi

          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"
          if [[ "${package_version}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

  build:
    name: Build ${{ matrix.label }} release assets
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            label: Linux
            artifact_glob: '*.AppImage'
          - runner: macos-14
            platform: macos
            label: macOS
            artifact_glob: '*.dmg'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils fakeroot rpm

      - name: Install dependencies
        run: npm ci

      - name: Import macOS signing certificate
        id: import-macos-cert
        if: matrix.platform == 'macos'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${MACOS_CERTIFICATE_BASE64}" || -z "${MACOS_CERTIFICATE_PASSWORD}" ]]; then
            echo "macOS signing certificate secrets are not configured; building an unsigned DMG." >&2
            echo "macos_identity_present=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          certificate_path="${RUNNER_TEMP}/developer-id-application.p12"
          keychain_path="${RUNNER_TEMP}/aether-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          echo "${MACOS_CERTIFICATE_BASE64}" | base64 -D > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" -P "${MACOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${keychain_password}" "${keychain_path}"
          identities="$(security find-identity -v -p codesigning "${keychain_path}")"
          echo "${identities}"

          if grep -q "Developer ID Application" <<< "${identities}"; then
            echo "macos_identity_present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "No Developer ID Application identity was found after importing the macOS signing certificate; building an unsigned DMG." >&2
            echo "macos_identity_present=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build distributables
        env:
          AETHER_SIGN_MACOS: ${{ matrix.platform == 'macos' && secrets.MACOS_CERTIFICATE_BASE64 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' && steps.import-macos-cert.outputs.macos_identity_present == 'true' && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: npm run make

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          count=0
          while IFS= read -r -d '' file; do
            cp "$file" release-assets/
            count=$((count + 1))
          done < <(find out/make -name '${{ matrix.artifact_glob }}' -print0)

          if [[ $count -eq 0 ]]; then
            echo "No release assets matched ${{ matrix.artifact_glob }}" >&2
            exit 1
          fi

          ls -lah release-assets

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs:
      - verify
      - build
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          ls -lah

      - name: Extract release notes
        run: node scripts/extract-release-notes.mjs "${{ needs.verify.outputs.version }}" release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Aether v${{ needs.verify.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          files: |
            release-assets/*
