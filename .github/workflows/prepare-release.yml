name: Prepare Release

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: prepare-release-main
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Version, changelog, and tag
    runs-on: ubuntu-22.04
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    steps:
      - name: Verify workflow token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh auth status >/dev/null

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare release metadata
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release:prepare

      - name: Commit release metadata
        if: steps.prepare.outputs.released == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          if [ -f .release-please-manifest.json ]; then
            git add .release-please-manifest.json
          fi
          if git diff --cached --quiet; then
            echo "Release metadata already committed; continuing to tag."
          else
            git commit -m "chore(release): aether ${{ steps.prepare.outputs.version }}"
          fi

      - name: Tag release
        if: steps.prepare.outputs.released == 'true'
        run: |
          set -euo pipefail
          tag="v${{ steps.prepare.outputs.version }}"
          head_commit="$(git rev-parse HEAD)"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "${tag}")"
            if [ "${tag_commit}" = "${head_commit}" ]; then
              echo "Tag ${tag} already exists locally and points to HEAD; reusing it."
            else
              echo "Tag ${tag} exists locally at ${tag_commit}, expected ${head_commit}; recreating it."
              git tag -f "${tag}"
            fi
          else
            git tag "${tag}"
          fi

      - name: Push release commit and tag
        if: steps.prepare.outputs.released == 'true'
        run: |
          set -euo pipefail
          tag="v${{ steps.prepare.outputs.version }}"
          tag_commit="$(git rev-list -n 1 "${tag}")"

          if ! git push --atomic origin HEAD:main "${tag}"; then
            remote_tag_commit="$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}')"
            if [ -z "${remote_tag_commit}" ]; then
              echo "Atomic push failed and ${tag} does not exist on origin." >&2
              exit 1
            fi

            if [ "${remote_tag_commit}" != "${tag_commit}" ]; then
              echo "Remote tag ${tag} points to ${remote_tag_commit}, expected ${tag_commit}." >&2
              exit 1
            fi

            echo "Tag ${tag} already exists on origin at ${remote_tag_commit}; pushing release metadata only."
            git push origin HEAD:main
          fi

      - name: Dispatch release workflow
        if: steps.prepare.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.prepare.outputs.version }}"

          for attempt in 1 2 3; do
            if gh workflow run release.yml --ref "${tag}"; then
              exit 0
            fi

            if [ "${attempt}" -eq 3 ]; then
              echo "Failed to dispatch release workflow for ${tag} after ${attempt} attempts." >&2
              exit 1
            fi

            sleep $((attempt * 5))
          done
